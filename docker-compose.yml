version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: shift_postgres
    environment:
      POSTGRES_USER: shift_user
      POSTGRES_PASSWORD: shift_password
      POSTGRES_DB: shift_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shift_user -d shift_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: